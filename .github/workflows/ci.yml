name: CI
on: [ pull_request, push, workflow_dispatch ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  check-uid:
    name: Check Vial UIDs
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
    - name: (actions) Checkout Vial repo
      uses: actions/checkout@v4
      with:
        persist-credentials: false

    - name: Verify Vial UID is unique per-keyboard
      run: python3 util/ci_vial_verify_uid.py

  build-vial:
    name: Build Charybdis nano Vial
    runs-on: ubuntu-latest
    container: ghcr.io/qmk/qmk_cli@sha256:2dc05fc9f32efebd6b05c2b8676ee548358bc7e151e9dbf4dac6b6eed4513b07

    steps:
    - name: (actions) Checkout Vial repo
      uses: actions/checkout@v4
      with:
        persist-credentials: false
        submodules: recursive

    - name: Build
      run: |
        git config --global --add safe.directory $(pwd)
        qmk compile -kb bastardkb/charybdis/3x5/v2/splinky_3 -km vial

    - name: Upload firmware
      uses: actions/upload-artifact@v4
      with:
        name: Charybdis_nano_Vial_firmware
        path: |
          *.uf2
          *.hex
          *.bin
